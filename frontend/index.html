<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Nexus</title>
    <!--
      Applies the saved theme before first paint, so a dark-mode user never
      sees a white flash. Must stay synchronous and inline: a deferred or
      external script would run after the browser has already painted.

      The storage key is duplicated from src/context/ThemeContext.ts
      (THEME_STORAGE_KEY) because this runs before any module loads.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hr_nexus_theme");
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          root.classList.toggle("dark", isDark);
          root.style.colorScheme = isDark ? "dark" : "light";
        } catch (error) {
          // Storage blocked (Safari private mode) - fall back to light.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
